version: '3.8'

services:
  
  backend:
    build: ./backend
    container_name: loop-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "5000:5000"
    volumes:
      
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: loop-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
